<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Survey Form</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-5">
  <div class="container border rounded p-4" style="max-width: 500px;">
    <img src="logo-vector-IU-01.png" alt="Logo" class="mb-3" width="100">
    <h2 class="text-primary">Survey</h2>
    <p>If you have a moment, we'd appreciate it if you would fill out this survey.</p>

    <h5>Your information:</h5>
    <div class="mb-3">
      <label class="form-label">First Name</label>
      <input type="text" class="form-control">
      <label class="form-label mt-2">Last Name</label>
      <input type="text" class="form-control">
      <label class="form-label mt-2">Email</label>
      <input type="email" class="form-control">
      <label class="form-label mt-2">Date of Birth</label>
      <input type="date" class="form-control">
    </div>

    <h5>How did you hear about us?</h5>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="source" id="search">
      <label class="form-check-label" for="search">Search engine</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="source" id="word">
      <label class="form-check-label" for="word">Word of mouth</label>
    </div>
    <div class="form-check">
      <input class="form-check-input" type="radio" name="source" id="social">
      <label class="form-check-label" for="social">Social Media</label>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="radio" name="source" id="other">
      <label class="form-check-label" for="other">Other</label>
    </div>

    <h5>Would you like to receive announcements?</h5>
    <div class="form-check">
      <input class="form-check-input" type="checkbox" id="offers">
      <label class="form-check-label" for="offers">YES, I'd like that.</label>
    </div>
    <div class="form-check mb-3">
      <input class="form-check-input" type="checkbox" id="emails">
      <label class="form-check-label" for="emails">YES, please send me email announcements.</label>
    </div>

    <label class="form-label">Please contact me by:</label>
    <select class="form-select mb-3">
      <option>Email or postal mail</option>
      <option>Email only</option>
      <option>Postal mail only</option>
    </select>

    <button class="btn btn-primary">Submit</button>
  </div>
</body>
</html>
